# CI for parallax-kv.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Newer pushes to the same ref supersede in-flight runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.24.x"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt needed on:" >&2
            echo "$out" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8

  unit-race:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # Every package under -race: the pure-core unit tests, kv, storage, the server drive loop, the gRPC
      # transport, the real-process e2e failover test, and the fixed-seed nemesis regression corpus.
      - name: go test -race
        run: go test ./... -race -count=1 -skip 'TestScenario(Soak|Determinism)$'

  determinism:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # The determinism gate: 10 seeds x every nemesis scenario, each run twice, trace hashes byte-compared
      # and op-counts checked.
      - name: determinism gate (10 seeds, double-run, trace-hash compare)
        run: go test ./sim -run 'TestScenarioDeterminism$' -det-lo=0 -det-hi=10 -count=1 -v

  sim-soak:
    runs-on: ubuntu-latest
    # ~200 fresh seeds x 7 scenarios = ~1400 runs at a measured ~1.3s/run on the
    # build host; budgeted at up to ~3x for a slower 2-core runner.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # First the fixed regression corpus (every committed seed, incl. any that a past soak failure pinned),
      # then ~200 fresh random seeds.
      - name: fixed-seed regression corpus
        run: go test ./sim -run 'TestScenarioRegression$' -count=1 -v

      - name: fresh-seed soak (~200 random seeds)
        run: |
          base=$(( (RANDOM << 34) ^ (RANDOM << 19) ^ (RANDOM << 4) ^ RANDOM ))
          hi=$(( base + 200 ))
          echo "soak seed range: [$base, $hi)"
          go test ./sim -run 'TestScenarioSoak$' -timeout 80m \
            -soak-lo="$base" -soak-hi="$hi" -count=1 -v

  bench-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # Build the real binaries, stand up a 3-node localhost cluster, and run a short closed-loop bench in
      # --smoke mode.
      - name: build binaries
        run: |
          mkdir -p bin
          go build -o bin/parallaxd ./cmd/parallaxd
          go build -o bin/parallax-bench ./cmd/parallax-bench

      - name: 3-node cluster + bench smoke
        run: |
          set -euo pipefail
          peers="1=localhost:17301,2=localhost:17302,3=localhost:17303"
          clients="1=localhost:18301,2=localhost:18302,3=localhost:18303"
          data="$(mktemp -d)"
          pids=()
          for i in 1 2 3; do
            bin/parallaxd --id "$i" --peers "$peers" --client-peers "$clients" \
              --data-dir "$data/d$i" --listen "localhost:$((18300 + i))" \
              --tick-ms 10 --heartbeat-ticks 3 --election-ticks 15 \
              >"$data/n$i.log" 2>&1 &
            pids+=("$!")
          done
          cleanup() { kill "${pids[@]}" 2>/dev/null || true; }
          trap cleanup EXIT
          # Give the cluster time to elect a leader before offering load.
          sleep 5
          bin/parallax-bench \
            --cluster "localhost:18301,localhost:18302,localhost:18303" \
            --workload write --smoke
